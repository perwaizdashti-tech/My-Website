<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashti Tech - Portfolio</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Navigation Bar Style (Fixed for Mobile) */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap; /* اس سے الفاظ اگلی لائن میں نہیں ٹوٹیں گے */
        }

        .navbar a:hover {
            color: #27ae60;
        }

        /* Main Content */
        .content {
            padding: 40px 20px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #27ae60;
            font-size: 20px;
        }

        /* Button Style */
        .my-button {
            background-color: #e74c3c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .my-button:hover {
            background-color: #c0392b;
            cursor: pointer;
        }

        .my-button:active {
            transform: scale(0.95);
            background-color: #a93226;
        }
