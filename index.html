<!DOCTYPE html>
<html>
<head>
    <title>My Styled Website</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #27ae60;
            font-size: 20px;
        }

        /* بٹن کا CSS اسٹائل */
        .my-button {
            background-color: #e74c3c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            transition: all 0.1s ease;
        }

        /* بٹن کا Hover ایفیکٹ */
        .my-button:hover {
            background-color: #c0392b;
            cursor: pointer;
        }

        /* بٹن کا Active ایفیکٹ (موبائل پر دبانے کے لیے) */
        .my-button:active {
            transform: scale(0.95);
            background-color: #a93226;
        }
    </style>
</head>
<body>

    <h1>سلام! یہ میری نئی ویب سائٹ ہے</h1>
    <p>میں نے HTML اور CSS کا استعمال کر کے اسے خوبصورت بنایا ہے۔</p>

    <!-- بٹن کا HTML -->
    <button class="my-button">👈 یہاں کلک کریں</button>

</body>
</html>
